<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Achievement Tracker">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solo Board Game Achievement Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f2f2f7;--card:#fff;--border:#e0e0e6;
  --text:#1a1a1a;--text-2:#555;--text-3:#999;
  --gold:#d4a017;--silver:#8a9aaa;--bronze:#c07840;
  --green:#34c759;--red:#ff3b30;--blue:#007aff;
  --radius:14px;--radius-sm:9px;--nav-h:56px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:calc(var(--nav-h) + 16px)}

.topbar{background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-title{font-size:17px;font-weight:700;letter-spacing:-.3px;flex:1;text-align:center}
.topbar-back{display:flex;align-items:center;gap:3px;font-size:15px;font-weight:500;color:var(--blue);cursor:pointer;border:none;background:none;font-family:'DM Sans',sans-serif;padding:8px 0;min-width:64px}
.topbar-pts{font-size:13px;font-weight:600;color:var(--gold);background:#fff8e6;border:1px solid #f0d870;border-radius:20px;padding:3px 10px;min-width:64px;text-align:right;white-space:nowrap}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;z-index:100}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--text-3);transition:color .15s}
.nav-btn.active{color:var(--blue)}
.nav-icon{font-size:22px;line-height:1}
.nav-label{font-size:10px;font-weight:500;letter-spacing:.2px}

.screen{display:none;flex-direction:column}
.screen.active{display:flex}
.content{max-width:600px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px;width:100%}

.card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px;border-bottom:1px solid var(--border)}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-3)}

/* Game cards */
.game-card{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 3px rgba(0,0,0,.07);cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px 16px;border-left:4px solid transparent;transition:background .1s;-webkit-user-select:none}
.game-card:active{background:#f0f0f5}
.game-card-icon{width:46px;height:46px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.game-card-info{flex:1;min-width:0}
.game-card-name{font-size:15px;font-weight:600}
.game-card-sub{font-size:12px;color:var(--text-3);margin-top:2px}
.game-card-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.game-card-pts{font-size:13px;font-weight:700;color:var(--gold)}
.prog-bar{width:56px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;transition:width .4s}
.prog-label{font-size:10px;color:var(--text-3)}

/* Game hero */
.game-hero{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.07);display:flex;gap:14px;align-items:flex-start}
.hero-icon{width:58px;height:58px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.hero-info{flex:1}
.hero-name{font-size:19px;font-weight:700;letter-spacing:-.3px}
.hero-genre{font-size:12px;color:var(--text-3);margin-top:2px}
.hero-stats{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-val{font-size:17px;font-weight:700;font-family:'DM Mono',monospace}
.hstat-lbl{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-top:1px}

/* Log button */
.btn-log{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px;border-radius:var(--radius);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;border:none;color:#fff;width:100%;transition:opacity .15s}
.btn-log:active{opacity:.75}

/* Achievements */
.ach-item{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.ach-item:last-child{border-bottom:none}
.ach-icon-wrap{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;border:2px solid var(--border);background:var(--bg)}
.ach-item.locked .ach-icon-wrap{filter:grayscale(1);opacity:.28}
.ach-item.new-unlock .ach-icon-wrap{animation:pulse .6s ease 3}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.ach-body{flex:1;min-width:0}
.ach-name{font-size:14px;font-weight:600}
.ach-item.locked .ach-name{color:var(--text-3)}
.ach-desc{font-size:12px;color:var(--text-3);margin-top:2px;line-height:1.4}
.ach-progress{font-size:11px;color:var(--blue);margin-top:3px;font-weight:500}
.ach-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.ach-pts{font-size:12px;font-weight:700;color:var(--gold)}
.ach-item.locked .ach-pts{color:var(--text-3)}
.ach-tier{font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.4px}
.tier-bronze{background:#f5ece6;color:var(--bronze)}
.tier-silver{background:#f0f2f4;color:var(--silver)}
.tier-gold{background:#fff8e0;color:var(--gold)}
.tier-plat{background:#f0f8ff;color:#4488cc}
.new-badge{font-size:9px;font-weight:700;background:#ff3b30;color:#fff;border-radius:4px;padding:1px 5px;text-transform:uppercase;letter-spacing:.4px}

/* Play history */
.play-item{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--border);font-size:13px}
.play-item:last-child{border-bottom:none}
.play-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.play-date{color:var(--text-3);flex-shrink:0;min-width:46px;font-size:12px}
.play-detail{flex:1;color:var(--text-2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.play-badge{font-size:11px;font-weight:600;flex-shrink:0}
.play-actions{display:flex;gap:6px;flex-shrink:0}
.play-action-btn{font-size:11px;color:var(--text-3);background:none;border:none;cursor:pointer;padding:2px 4px;border-radius:3px;font-family:'DM Sans',sans-serif}
.play-action-btn:hover{color:var(--red)}

/* Meta category headers */
.meta-category-header{padding:14px 16px 6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-3);background:var(--bg)}
.meta-category-desc{padding:0 16px 10px;font-size:12px;color:var(--text-3);line-height:1.4}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-end;backdrop-filter:blur(2px)}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px 40px;width:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow-y:auto;box-shadow:0 -4px 32px rgba(0,0,0,.15)}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto -4px}
.modal-title{font-size:17px;font-weight:700;text-align:center}
.modal-section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-3)}
.modal-field{display:flex;flex-direction:column;gap:6px}
.modal-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text-3)}
.modal-select,.modal-input{font-family:'DM Sans',sans-serif;font-size:15px;padding:11px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);outline:none;width:100%;-webkit-appearance:none}
.modal-select:focus,.modal-input:focus{border-color:var(--blue)}
.modal-toggle-row{display:flex;align-items:center;justify-content:space-between}
.toggle-label{font-size:15px}
.toggle{width:46px;height:27px;border-radius:14px;background:#ccc;position:relative;cursor:pointer;border:none;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--green)}
.toggle::after{content:'';position:absolute;width:23px;height:23px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.toggle.on::after{transform:translateX(19px)}
.toggle-val{font-size:11px;color:var(--text-3);margin-top:3px}
.btn-submit{padding:14px;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;border:none;color:#fff;transition:opacity .15s}
.btn-submit:hover{opacity:.88}
.btn-cancel{padding:12px;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;border:1.5px solid var(--border);background:none;color:var(--text-2)}

/* Edit modal extras */
.edit-delete-btn{padding:12px;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;border:1.5px solid #ffb3ae;background:none;color:var(--red)}

/* Unlock banner */
.unlock-banner{display:none;position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#fff;border:1.5px solid #f0d870;border-radius:var(--radius);padding:14px 18px;box-shadow:0 6px 24px rgba(0,0,0,.14);z-index:300;max-width:300px;width:calc(100% - 32px);text-align:center;animation:bannerIn .3s ease;cursor:pointer}
@keyframes bannerIn{from{transform:translateX(-50%) translateY(-12px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
.ub-emoji{font-size:30px;margin-bottom:4px}
.ub-eyebrow{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-3)}
.ub-name{font-size:15px;font-weight:700;margin-top:2px}
.ub-pts{font-size:12px;color:var(--gold);font-weight:600;margin-top:2px}
.ub-dismiss{font-size:11px;color:var(--text-3);margin-top:6px}

/* Toast */
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a1a1a;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:500;opacity:0;transition:transform .25s,opacity .25s;pointer-events:none;z-index:300;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

.btn-danger{width:100%;padding:13px;border-radius:var(--radius);background:none;border:1.5px solid #ffb3ae;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;color:var(--red);cursor:pointer}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border);font-size:15px}
.settings-row:last-child{border-bottom:none}
.settings-row-val{color:var(--text-3);font-size:13px}
.empty-state{padding:40px 20px;text-align:center;color:var(--text-3);font-size:14px;line-height:1.6}
.empty-icon{font-size:36px;margin-bottom:10px}

/* Official badge */
.official-badge{font-size:9px;font-weight:700;background:#e8f4ec;color:#3a8a4a;border:1px solid #b0d4b8;border-radius:4px;padding:1px 5px;text-transform:uppercase;letter-spacing:.4px;margin-left:4px;vertical-align:middle}

/* Near-miss indicator */
.near-miss .ach-desc{color:var(--blue)}
.near-miss .ach-icon-wrap{border-color:var(--blue)!important;opacity:.6!important;filter:none!important}
.near-miss-label{font-size:10px;font-weight:700;color:var(--blue);margin-top:3px;text-transform:uppercase;letter-spacing:.4px}

/* Score titles */
.score-title-banner{background:linear-gradient(135deg,#fff8e0,#fff);border:1px solid #f0d870;border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.07);margin-bottom:0}
.score-title-icon{font-size:28px}
.score-title-text{flex:1}
.score-title-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-3)}
.score-title-name{font-size:20px;font-weight:700;color:var(--text);margin-top:2px}
.score-title-next{font-size:12px;color:var(--text-3);margin-top:2px}
.score-title-table{padding:8px 0}
.score-title-row{display:flex;align-items:center;justify-content:space-between;padding:6px 16px;font-size:13px;border-bottom:1px solid var(--border)}
.score-title-row:last-child{border-bottom:none}
.score-title-row.current{background:#fff8e0;font-weight:600}
.score-title-pts{color:var(--text-3);font-family:'DM Mono',monospace;font-size:12px}

/* Personal bests */
.pb-table{padding:4px 0}
.pb-row{display:flex;align-items:center;justify-content:space-between;padding:7px 16px;font-size:13px;border-bottom:1px solid var(--border)}
.pb-row:last-child{border-bottom:none}
.pb-label{color:var(--text-2)}
.pb-val{font-family:'DM Mono',monospace;font-weight:600;color:var(--text)}

/* Sort/filter bar */
.list-controls{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.sort-chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;border:1.5px solid var(--border);background:none;color:var(--text-3);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;white-space:nowrap}
.sort-chip.active{background:var(--text);border-color:var(--text);color:#fff}
.filter-input{flex:1;padding:7px 12px;border:1.5px solid var(--border);border-radius:20px;font-size:13px;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);outline:none}
.filter-input:focus{border-color:var(--blue)}

/* Import indicator */
.import-indicator{font-size:11px;color:var(--text-3);padding:6px 16px;border-top:1px solid var(--border)}
.import-indicator.stale{color:#e08030}

/* Notes field */
.notes-field{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:14px;background:var(--bg);color:var(--text);outline:none;resize:none;min-height:60px;line-height:1.5}
.notes-field:focus{border-color:var(--blue)}

/* Dorfromantik campaign */





.bubble-track{display:flex;flex-wrap:wrap;gap:5px;padding:4px 0}
.bubble{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);background:var(--bg);cursor:pointer;transition:all .15s;flex-shrink:0}
.bubble.filled{background:var(--green);border-color:var(--green)}
.bubble.milestone{border-color:var(--gold);border-width:2px}
.bubble.milestone.filled{background:var(--gold);border-color:var(--gold)}
.bubble.card-milestone{border-color:#4488cc;border-width:2px}
.bubble.card-milestone.filled{background:#4488cc;border-color:#4488cc}
.bubble.milestone.filled{background:var(--gold);border-color:var(--gold)}
.dorf-game-row{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--border);font-size:13px}
.dorf-game-row:last-child{border-bottom:none}
.dorf-score{font-family:'DM Mono',monospace;font-weight:700;font-size:15px;min-width:40px}
.dorf-ach-row{display:flex;align-items:flex-start;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border)}
.dorf-ach-row:last-child{border-bottom:none}
.dorf-ach-check{width:22px;height:22px;border-radius:4px;border:1.5px solid var(--border);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;transition:all .15s;color:transparent}
.dorf-ach-check.checked{background:var(--green);border-color:var(--green);color:#fff}
.dorf-ach-body{flex:1}
.dorf-ach-name{font-size:14px;font-weight:600}
.dorf-ach-desc{font-size:12px;color:var(--text-3);margin-top:2px}
.dorf-box-header{display:flex;align-items:center;gap:8px;padding:12px 16px 8px;border-bottom:1px solid var(--border)}
.dorf-box-icon{font-size:16px}
.dorf-box-title{font-size:13px;font-weight:700;color:var(--text)}
.dorf-box-status{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;margin-left:auto}
.dorf-box-status.locked{background:var(--bg);color:var(--text-3);border:1px solid var(--border)}
.dorf-box-status.unlocked{background:#f0faf4;color:var(--green);border:1px solid #b0dfc0}
</style>
</head>
<body>
<div class="topbar" id="topbar">
  <div id="topbarLeft" style="min-width:64px"></div>
  <div class="topbar-title" id="topbarTitle">Solo Achievements</div>
  <div class="topbar-pts" id="totalPtsDisplay">0 pts</div>
</div>

<div class="screen active" id="screen-home">
  <div class="content">
    <div id="homeGameList"></div>
    <div id="homeRecent"></div>
  </div>
</div>

<div class="screen" id="screen-game">
  <div class="content" id="gameDetailContent"></div>
</div>

<div class="screen" id="screen-meta">
  <div class="content" id="metaContent"></div>
</div>

<div class="screen" id="screen-settings">
  <div class="content">
    <div class="card" id="settingsGameList"></div>
    <div class="card">
      <div class="card-header"><span class="card-title">BGStats Import</span></div>
      <div style="padding:14px 16px;display:flex;flex-direction:column;gap:10px">
        <div style="font-size:13px;color:var(--text-2);line-height:1.5">Import your full BGStats play history in one shot. In BGStats: Settings → Backup → Export.</div>
        <button class="btn-log" style="background:var(--blue)" onclick="openImport(null)">⬇ Import Full BGStats History</button>
        <div id="lastImportIndicator" class="import-indicator"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Data</span></div>
      <div style="padding:14px 16px;display:flex;flex-direction:column;gap:12px">
        <div style="font-size:13px;color:var(--text-2);line-height:1.5">Play history and achievements are stored locally in this browser.</div>
        <div style="font-size:12px;color:var(--text-3)">Version 0.51</div>
        <button class="btn-danger" onclick="resetAll()">Reset All Data</button>
      </div>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-home" onclick="navTo('home')">
    <span class="nav-icon">🎮</span><span class="nav-label">Games</span>
  </button>
  <button class="nav-btn" id="nav-meta" onclick="navTo('meta')">
    <span class="nav-icon">🏆</span><span class="nav-label">Meta</span>
  </button>
  <button class="nav-btn" id="nav-settings" onclick="navTo('settings')">
    <span class="nav-icon">⚙️</span><span class="nav-label">Settings</span>
  </button>
</nav>

<!-- Log/Edit Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">Log Play</div>
    <div id="modalFields"></div>
    <button class="btn-submit" id="modalSubmit" onclick="submitPlay()">Log Play</button>
    <button class="edit-delete-btn" id="modalDelete" style="display:none" onclick="deletePlay()">Delete This Play</button>
    <button class="btn-cancel" onclick="closeModal()">Cancel</button>
  </div>
</div>

<!-- Unlock Banner -->
<div class="unlock-banner" id="unlockBanner" onclick="dismissBanner()">
  <div class="ub-emoji" id="ubEmoji"></div>
  <div class="ub-eyebrow">Achievement Unlocked</div>
  <div class="ub-name" id="ubName"></div>
  <div class="ub-pts" id="ubPts"></div>
  <div class="ub-dismiss">Tap to dismiss</div>
</div>
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════
// GAME & META DEFINITIONS
// ═══════════════════════════════════════
const GAME_DEFINITIONS = [

  // ── Test Game ──────────────────────────────────────────────
{
  id: 'example_game',           // unique string, used as localStorage key
  name: 'Example Game',
  bggId: 123456,           // BGG game ID (for BGStats import matching)
  color: '#4a7c6f',        // header/accent color
  icon: '🎲',

  // Fields shown in the Log Play modal
  logFields: [
    { id: 'win', label: 'Win?', type: 'toggle', trueLabel: 'Yes ✓', falseLabel: 'No ✗' },
    { id: 'score',    label: 'Score',    type: 'number' },
    { id: 'level',    label: 'Level',    type: 'select',
      options: ['Easy', 'Normal', 'Hard'] },

// ═══════════════════════════════════════
// CONDITION ENGINE
// ═══════════════════════════════════════
function evalCondition(check, gameState, allState, unlockedMap, calcPts) {
  const plays = gameState?.plays || [];
  const wins  = plays.filter(p => p.win);

  switch (check.type) {
    case 'min_plays':         return plays.length >= check.count;
    case 'min_wins':          return wins.length >= check.count;
    case 'win_with_field':    return wins.some(p => String(p[check.field]) === String(check.value));
    case 'win_with_toggle':   return wins.some(p => p[check.field] === true);
    case 'toggle_false':      return plays.some(p => p[check.field] === false);
    case 'win_toggle_false':  return wins.some(p => p[check.field] === false);
    case 'field_eq':          return plays.some(p => String(p[check.field]) === String(check.value));
    case 'field_lte':         return plays.some(p => Number(p[check.field]) <= check.value);
    case 'field_gte':         return plays.some(p => Number(p[check.field]) >= check.value);
    case 'win_field_eq':      return wins.some(p => String(p[check.field]) === String(check.value));
    case 'win_field_gte':     return wins.some(p => Number(p[check.field]) >= check.value);
    case 'win_field_lte':     return wins.some(p => Number(p[check.field]) <= check.value);
    case 'all_fields_gte':    return plays.some(p => check.fields.every(f => Number(p[f]) >= check.value));
    case 'n_fields_gte':      return plays.some(p => check.fields.filter(f => Number(p[f]) >= check.value).length >= check.count);
    case 'any_field_max_gte': return plays.some(p => check.fields.some(f => Number(p[f]) >= check.value));
    case 'cumulative_field_gte': {
      const total = plays.reduce((s,p) => s + (Number(p[check.field])||0), 0);
      return total >= check.value;
    }
    case 'unique_win_values': {
      const vals = new Set(wins.map(p=>p[check.field]).filter(v=>v&&v!=='Unknown'&&v!=='Any / Unknown'&&v!=='None'));
      return vals.size >= check.count;
    }
    case 'win_all_values':
      return check.values.every(v => wins.some(p => p[check.field] === v));
    case 'win_all_values_multifield':
      return check.values.every(v => wins.some(p => check.fields.some(f => p[f] === v)));
    case 'unique_win_values_multifield': {
      const vals = new Set();
      wins.forEach(p => check.fields.forEach(f => { if(p[f]&&p[f]!=='None') vals.add(p[f]); }));
      return vals.size >= check.count;
    }

    // Compound: win + multifield has value + another field equals condValue
    case 'win_multifield_value_and_field_eq':
      return wins.some(p =>
        check.fields.some(f => p[f] === check.value) &&
        String(p[check.condField]) === String(check.condValue)
      );
    // Compound: win + toggle true + field equals condValue
    case 'win_with_toggle_and_field_eq':
      return wins.some(p =>
        p[check.field] === true &&
        String(p[check.condField]) === String(check.condValue)
      );
    // Compound: win + field >= value + field equals condValue
    case 'win_field_gte_and_field_eq':
      return wins.some(p =>
        Number(p[check.field]) >= check.value &&
        String(p[check.condField]) === String(check.condValue)
      );
    // Compound: win + field <= value + field equals condValue
    case 'win_field_lte_and_field_eq':
      return wins.some(p =>
        Number(p[check.field]) <= check.value &&
        String(p[check.condField]) === String(check.condValue)
      );

    case 'all_achievements':  return check.ids.every(id => unlockedMap[id]);
    case 'all_games_played':  return GAME_DEFINITIONS.filter(g=>g.id!=='dorfromantik').every(g => (allState[g.id]?.plays||[]).length >= 1);
    case 'all_games_won':     return GAME_DEFINITIONS.filter(g=>g.id!=='dorfromantik').every(g => (allState[g.id]?.plays||[]).some(p=>p.win));
    case 'total_wins_gte': {
      const n = GAME_DEFINITIONS.reduce((s,g)=>s+(allState[g.id]?.plays||[]).filter(p=>p.win).length,0);
      return n >= check.count;
    }
    case 'games_played_gte': {
      const n = GAME_DEFINITIONS.filter(g=>(allState[g.id]?.plays||[]).length>0).length;
      return n >= check.count;
    }
    case 'total_plays_gte': {
      const n = GAME_DEFINITIONS.reduce((s,g)=>s+(allState[g.id]?.plays||[]).length,0);
      return n >= check.count;
    }
    case 'total_pts_gte':     return calcPts() >= check.count;
    case 'win_streak': {
      const all = GAME_DEFINITIONS.flatMap(g=>(allState[g.id]?.plays||[]).map(p=>({win:p.win,ts:p.ts}))).sort((a,b)=>b.ts-a.ts);
      let streak=0; for(const p of all){if(p.win)streak++;else break;} return streak >= check.count;
    }
    case 'cross_same_day': {
      const [g1,g2] = check.games;
      const dates1 = new Set((allState[g1]?.plays||[]).filter(p=>p.win).map(p=>p.date));
      return (allState[g2]?.plays||[]).some(p=>p.win&&dates1.has(p.date));
    }
    case 'n_different_games_in_week': {
      const now=Date.now(), week=7*24*60*60*1000;
      const n = GAME_DEFINITIONS.filter(g=>(allState[g.id]?.plays||[]).some(p=>now-p.ts<week)).length;
      return n >= check.count;
    }
    case 'all_games_in_week': {
      const now=Date.now(), week=7*24*60*60*1000;
      return GAME_DEFINITIONS.filter(g=>g.id!=='dorfromantik').every(g=>(allState[g.id]?.plays||[]).some(p=>now-p.ts<week));
    }

    // n_different_games_won_same_day: won N+ different games on the same calendar date
    case 'n_different_games_won_same_day': {
      const dateGames = {};
      GAME_DEFINITIONS.forEach(g => {
        (allState[g.id]?.plays||[]).filter(p=>p.win).forEach(p => {
          if (!dateGames[p.date]) dateGames[p.date] = new Set();
          dateGames[p.date].add(g.id);
        });
      });
      return Object.values(dateGames).some(s => s.size >= check.count);
    }

    // all_games_won_subset: won at least once in each listed game
    case 'all_games_won_subset':
      return check.games.every(gid => (allState[gid]?.plays||[]).some(p=>p.win));
    case 'all_plat_achievements': {
      const platIds = GAME_DEFINITIONS.flatMap(g=>(g.achievements||[]).filter(a=>a.tier==='plat').map(a=>a.id));
      return platIds.every(id=>unlockedMap[id]);
    }
    case 'plat_count_gte': {
      const platIds = GAME_DEFINITIONS.flatMap(g=>(g.achievements||[]).filter(a=>a.tier==='plat').map(a=>a.id));
      return platIds.filter(id=>unlockedMap[id]).length >= check.count;
    }
    // any_toggle_count_gte: at least N of listed toggle fields are true across ANY play
    case 'any_toggle_count_gte': {
      const count = plays.reduce((total, p) => {
        const trueInPlay = check.fields.filter(f => p[f] === true).length;
        return total + trueInPlay;
      }, 0);
      // Deduplicate — count distinct fields ever set to true
      const everTrue = new Set();
      plays.forEach(p => check.fields.forEach(f => { if (p[f] === true) everTrue.add(f); }));
      return everTrue.size >= check.count;
    }

    // win_field_beats_by: won a game where field - compareField >= margin
    case 'win_field_beats_by':
      return wins.some(p =>
        (Number(p[check.field]) - Number(p[check.compareField])) >= check.margin
      );

    // win_two_fields: won a game where field1===value1 AND field2===value2
    case 'win_two_fields':
      return wins.some(p =>
        String(p[check.field1]) === String(check.value1) &&
        String(p[check.field2]) === String(check.value2)
      );

    // win_two_fields_gte: won a game where field1>=value1 AND field2>=value2
    case 'win_two_fields_gte':
      return wins.some(p =>
        Number(p[check.field1]) >= check.value1 &&
        Number(p[check.field2]) >= check.value2
      );

    // all_games_in_month: all games played at least once in any calendar month
    case 'all_games_in_month': {
      const byMonth = {};
      GAME_DEFINITIONS.forEach(g => {
        (allState[g.id]?.plays||[]).forEach(p => {
          const month = p.date?.slice(0,7);
          if (!month) return;
          if (!byMonth[month]) byMonth[month] = new Set();
          byMonth[month].add(g.id);
        });
      });
      const total = GAME_DEFINITIONS.length;
      return Object.values(byMonth).some(s => s.size >= total);
    }

    // win_streak_game: last N plays of THIS game are all wins
    case 'win_streak_game': {
      const last = plays.slice(-check.count);
      return last.length >= check.count && last.every(p => p.win);
    }

    // count_wins_with_field_values: won N+ games where field is one of values
    case 'count_wins_with_field_values': {
      const matching = wins.filter(p => check.values.includes(String(p[check.field])));
      return matching.length >= check.count;
    }

    default:
      console.warn('Unknown condition type:', check.type);
      return false;
  }
}

// PROGRESS HINTS
// Returns a human-readable progress string for locked achievements
// ═══════════════════════════════════════
function getProgressPct(check, gameState, allState) {
  const plays = gameState?.plays || [];
  const wins  = plays.filter(p => p.win);
  switch(check.type) {
    case 'min_plays':    return Math.min(1, plays.length / check.count);
    case 'min_wins':     return Math.min(1, wins.length / check.count);
    case 'win_all_values': {
      const have = check.values.filter(v=>wins.some(p=>p[check.field]===v)).length;
      return have / check.values.length;
    }
    case 'win_all_values_multifield': {
      const have = check.values.filter(v=>wins.some(p=>check.fields.some(f=>p[f]===v))).length;
      return have / check.values.length;
    }
    case 'unique_win_values': {
      const vals = new Set(wins.map(p=>p[check.field]).filter(v=>v&&v!=='Unknown'&&v!=='None'));
      return Math.min(1, vals.size / check.count);
    }
    case 'field_gte': {
      const best = plays.reduce((m,p)=>Math.max(m,Number(p[check.field])||0),0);
      return Math.min(1, best / check.value);
    }
    case 'win_field_gte': {
      const best = wins.reduce((m,p)=>Math.max(m,Number(p[check.field])||0),0);
      return Math.min(1, best / check.value);
    }
    case 'all_achievements': {
      const have = check.ids.filter(id=>unlocked[id]).length;
      return have / check.ids.length;
    }
    default: return 0;
  }
}

function getCurrentScoreTitle(g) {
  if (!g.scoreTitles) return null;
  const plays = appState[g.id]?.plays || [];
  if (!plays.length) return null;
  const bestScore = Math.max(...plays.map(p => Number(p.score)||0));
  let current = g.scoreTitles[0];
  for (const t of g.scoreTitles) {
    if (bestScore >= t.min) current = t;
  }
  const nextIdx = g.scoreTitles.indexOf(current) + 1;
  const next = g.scoreTitles[nextIdx] || null;
  return { title: current.title, bestScore, next };
}

function getPersonalBests(g) {
  if (!g.personalBestField) return null;
  const plays = appState[g.id]?.plays || [];
  const wins  = plays.filter(p => p.win);
  const field = g.personalBestField;
  const byValue = {};
  wins.forEach(p => {
    const key = p[field];
    if (!key || key === 'Unknown' || key === 'None') return;
    const s = Number(p.score) || 0;
    if (!byValue[key] || s > byValue[key]) byValue[key] = s;
  });
  return byValue;
}

function renderScoreTitles(g) {
  const info = getCurrentScoreTitle(g);
  if (!info) return '';
  const tierHtml = g.scoreTitles.map(t => {
    const isCurrent = t.title === info.title;
    return `<div class="score-title-row ${isCurrent?'current':''}">
      <span>${t.title}</span>
      <span class="score-title-pts">${t.min}+ pts</span>
    </div>`;
  }).reverse().join('');
  return `<div class="score-title-banner">
    <div class="score-title-icon">🏅</div>
    <div class="score-title-text">
      <div class="score-title-label">Current Title</div>
      <div class="score-title-name">${info.title}</div>
      ${info.next ? `<div class="score-title-next">Next: ${info.next.title} at ${info.next.min} pts</div>` : '<div class="score-title-next">Maximum title reached!</div>'}
    </div>
  </div>
  <div class="card">
    <div class="card-header"><span class="card-title">Score Rankings</span></div>
    <div class="score-title-table">${tierHtml}</div>
  </div>`;
}

function renderPersonalBests(g) {
  const bests = getPersonalBests(g);
  if (!bests || !Object.keys(bests).length) return '';
  const field = g.personalBestField;
  const label = g.logFields?.find(f=>f.id===field)?.label || field;
  const rows = Object.entries(bests)
    .sort((a,b) => b[1]-a[1])
    .map(([k,v]) => `<div class="pb-row"><span class="pb-label">${k}</span><span class="pb-val">${v} pts</span></div>`)
    .join('');
  return `<div class="card">
    <div class="card-header"><span class="card-title">Best Score by ${label}</span></div>
    <div class="pb-table">${rows}</div>
  </div>`;
}

function getProgress(check, gameState, allState) {
  const plays = gameState?.plays || [];
  const wins  = plays.filter(p => p.win);

  switch (check.type) {
    case 'min_plays':    return `${plays.length} / ${check.count} plays`;
    case 'min_wins':     return `${wins.length} / ${check.count} wins`;
    case 'win_all_values': {
      const have = check.values.filter(v => wins.some(p=>p[check.field]===v)).length;
      return `${have} / ${check.values.length}`;
    }
    case 'win_all_values_multifield': {
      const have = check.values.filter(v => wins.some(p=>check.fields.some(f=>p[f]===v))).length;
      return `${have} / ${check.values.length}`;
    }
    case 'unique_win_values': {
      const vals = new Set(wins.map(p=>p[check.field]).filter(v=>v&&v!=='Unknown'&&v!=='None'));
      return `${vals.size} / ${check.count}`;
    }
    case 'field_gte':    return `Best: ${plays.reduce((m,p)=>Math.max(m,Number(p[check.field])||0),0)} / ${check.value}`;
    case 'win_field_gte':return `Best win: ${wins.reduce((m,p)=>Math.max(m,Number(p[check.field])||0),0)} / ${check.value}`;
    case 'total_plays_gte': {
      const n = GAME_DEFINITIONS.reduce((s,g)=>s+(allState[g.id]?.plays||[]).length,0);
      return `${n} / ${check.count} plays`;
    }
    case 'total_wins_gte': {
      const n = GAME_DEFINITIONS.reduce((s,g)=>s+(allState[g.id]?.plays||[]).filter(p=>p.win).length,0);
      return `${n} / ${check.count} wins`;
    }
    case 'games_played_gte': {
      const n = GAME_DEFINITIONS.filter(g=>(allState[g.id]?.plays||[]).length>0).length;
      return `${n} / ${check.count} games`;
    }
    case 'win_streak': {
      const all = GAME_DEFINITIONS.flatMap(g=>(allState[g.id]?.plays||[]).map(p=>({win:p.win,ts:p.ts}))).sort((a,b)=>b.ts-a.ts);
      let streak=0; for(const p of all){if(p.win)streak++;else break;}
      return `Current streak: ${streak} / ${check.count}`;
    }
    case 'all_achievements': {
      const have = check.ids.filter(id=>unlocked[id]).length;
      return `${have} / ${check.ids.length}`;
    }
    case 'plat_count_gte': {
      const platIds = GAME_DEFINITIONS.flatMap(g=>(g.achievements||[]).filter(a=>a.tier==='plat').map(a=>a.id));
      return `${platIds.filter(id=>unlocked[id]).length} / ${check.count} platinums`;
    }
    case 'any_toggle_count_gte': {
      const everTrue = new Set();
      plays.forEach(p => check.fields.forEach(f => { if(p[f]===true) everTrue.add(f); }));
      return `${everTrue.size} / ${check.count}`;
    }
    case 'win_field_beats_by': {
      const best = wins.reduce((m,p) => Math.max(m, Number(p[check.field])-Number(p[check.compareField])), 0);
      return `Best margin: ${best} / ${check.margin}`;
    }
    case 'win_two_fields': return null;
    case 'win_two_fields_gte': {
      const best1 = plays.reduce((m,p)=>Math.max(m,Number(p[check.field1])||0),0);
      return `Best ${check.field1}: ${best1} / ${check.value1}`;
    }
    default: return null;
  }
}

let appState = {}, unlocked = {}, newlyUnlocked = new Set(), unlockedDates = {}, sortMode = 'alpha', gameFilter = '';

function loadState() {
  try {
    const s = localStorage.getItem('solo_tracker_pub_v3');
    if (s) { const d=JSON.parse(s); appState=d.state||{}; unlocked=d.unlocked||{}; unlockedDates=d.unlockedDates||{}; }
  } catch(e){}
}
function saveState() {
  localStorage.setItem('solo_tracker_pub_v3', JSON.stringify({state:appState,unlocked,unlockedDates}));
}

function calcTotalPts() {
  let pts=0;
  GAME_DEFINITIONS.forEach(g=>g.achievements?.forEach(a=>{ if(unlocked[a.id]) pts+=a.pts; }));
  META_DEFINITIONS.forEach(a=>{ if(unlocked[a.id]) pts+=a.pts; });
  return pts;
}
function calcGamePts(gid) {
  const g=GAME_DEFINITIONS.find(x=>x.id===gid);
  if (!g.achievements) return {earned:0,total:0};
  let earned=0, total=0;
  g.achievements.forEach(a=>{ total+=a.pts; if(unlocked[a.id]) earned+=a.pts; });
  return {earned,total};
}

function checkAll() {
  const newUnlocks=[];
  GAME_DEFINITIONS.forEach(g=>{
    if (!g.achievements) return;
    const gs=appState[g.id]||{plays:[]};
    g.achievements.forEach(a=>{
      if(!unlocked[a.id] && evalCondition(a.check,gs,appState,unlocked,calcTotalPts)){
        unlocked[a.id]=true; newlyUnlocked.add(a.id); unlockedDates[a.id]=new Date().toISOString().split('T')[0]; newUnlocks.push({...a,source:g.name});
      }
    });
  });
  META_DEFINITIONS.forEach(a=>{
    if(!unlocked[a.id] && evalCondition(a.check,null,appState,unlocked,calcTotalPts)){
      unlocked[a.id]=true; newlyUnlocked.add(a.id); newUnlocks.push({...a,source:'Meta'});
    }
  });
  return newUnlocks;
}

  else if (currentNav==='settings') renderSettings();

function getSortedFilteredGames() {
  let games = [...GAME_DEFINITIONS];
  if (gameFilter) games = games.filter(g => g.name.toLowerCase().includes(gameFilter.toLowerCase()));
  switch(sortMode) {
    case 'recent': {
      games.sort((a,b) => {
        const ta = Math.max(...(appState[a.id]?.plays||[{ts:0}]).map(p=>p.ts));
        const tb = Math.max(...(appState[b.id]?.plays||[{ts:0}]).map(p=>p.ts));
        return tb - ta;
      }); break;
    }
    case 'pts': {
      games.sort((a,b) => calcGamePts(b.id).earned - calcGamePts(a.id).earned); break;
    }
    case 'winrate': {
      games.sort((a,b) => {
        const pa = appState[a.id]?.plays||[], pb = appState[b.id]?.plays||[];
        const wa = pa.length ? pa.filter(p=>p.win).length/pa.length : 0;
        const wb = pb.length ? pb.filter(p=>p.win).length/pb.length : 0;
        return wb - wa;
      }); break;
    }
    default: games.sort((a,b)=>a.name.localeCompare(b.name));
  }
  return games;
}

  sortMode = mode;

}

function renderGameDetail(g) {

  const plays = appState[g.id]?.plays||[];
  const wins  = plays.filter(p=>p.win).length;
  const {earned,total} = calcGamePts(g.id);
  const winPct = plays.length?Math.round(wins/plays.length*100):0;

  // Extra stats
  const streak = calcStreak(g.id);
  const lastPlayed = plays.length ? new Date(Math.max(...plays.map(p=>p.ts))).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';

  const gs4ach = appState[g.id]||{plays:[]};
  const achHtml = (g.achievements||[]).map(a=>{
    const u=!!unlocked[a.id];
    const isNew = newlyUnlocked.has(a.id);
    const progress = !u ? getProgress(a.check, gs4ach, appState) : null;
    const progressPct = progress ? getProgressPct(a.check, gs4ach, appState) : 0;
    const isNearMiss = !u && progressPct >= 0.8 && progressPct < 1;
    const unlockDate = u && unlockedDates[a.id] ? unlockedDates[a.id] : null;
    return `<div class="ach-item ${u?'unlocked':'locked'}${isNew?' new-unlock':''}${isNearMiss?' near-miss':''}">
      <div class="ach-icon-wrap" style="${u?`background:${g.bgColor};border-color:${g.dimColor};`:''}">
        ${a.icon}
      </div>
      <div class="ach-body">
        <div class="ach-name">${a.name}${isNew?` <span class="new-badge">NEW</span>`:''}${a.official||g.official?` <span class="official-badge">Official</span>`:''}</div>
        <div class="ach-desc">${a.desc}</div>
        ${progress?`<div class="ach-progress">${isNearMiss?'🔥 ':''} ${progress}</div>`:''}
        ${isNearMiss?`<div class="near-miss-label">Almost there!</div>`:''}
        ${unlockDate?`<div style="font-size:10px;color:var(--text-3);margin-top:2px">Unlocked ${unlockDate}</div>`:''}
      </div>
      <div class="ach-right">
        <div class="ach-pts">${a.pts} pts</div>
        <div class="ach-tier tier-${a.tier}">${a.tier}</div>
      </div>
    </div>`;
  }).join('');

  const histHtml = plays.length===0
    ? '<div class="empty-state"><div class="empty-icon">📋</div>No plays logged yet.</div>'
    : [...plays].reverse().slice(0,15).map((p,ri)=>{
        const realIdx = plays.length - 1 - ri;
        const d=new Date(p.ts).toLocaleDateString('en-US',{month:'short',day:'numeric'});
        const s=buildSummary(g,p);
        const noteStr = p.notes ? `<div style="font-size:11px;color:var(--text-3);padding:2px 0 4px 0;grid-column:1/-1">${p.notes}</div>` : '';
        return `<div class="play-item" style="${p.notes?'flex-wrap:wrap':''}">
          <div class="play-dot" style="background:${p.win?'var(--green)':'var(--red)'}"></div>
          <span class="play-date">${d}</span>
          <span class="play-detail">${s||'—'}</span>
          <div class="play-actions">
            <span class="play-badge" style="color:${p.win?'var(--green)':'var(--red)'}">${p.win?'WIN':'LOSS'}</span>
            <button class="play-action-btn" onclick="editPlay('${g.id}',${realIdx})" title="Edit">✎</button>
            <button class="play-action-btn" onclick="deletePlayAt('${g.id}',${realIdx})" title="Delete">✕</button>
          </div>
          ${noteStr}
        </div>`;
      }).join('');

  document.getElementById('gameDetailContent').innerHTML = `
    <div class="game-hero" style="border-left:4px solid ${g.color}">
      <div class="hero-icon" style="background:${g.bgColor}">${g.icon}</div>
      <div class="hero-info">
        <div class="hero-name">${g.name}</div>
        <div class="hero-genre">${g.genre}</div>
        <div class="hero-stats">
          <div class="hstat"><div class="hstat-val">${plays.length}</div><div class="hstat-lbl">Plays</div></div>
          <div class="hstat"><div class="hstat-val">${wins}</div><div class="hstat-lbl">Wins</div></div>
          <div class="hstat"><div class="hstat-val">${winPct}%</div><div class="hstat-lbl">Win %</div></div>
          <div class="hstat"><div class="hstat-val" style="color:var(--gold)">${earned}</div><div class="hstat-lbl">Points</div></div>
          <div class="hstat"><div class="hstat-val" style="font-size:13px">${streak}</div><div class="hstat-lbl">Streak</div></div>
        </div>
        <div style="font-size:11px;color:var(--text-3);margin-top:6px">Last played: ${lastPlayed}</div>
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn-log" style="background:${g.color};flex:1" onclick="openModal('${g.id}')">+ Log Play</button>
    </div>
    ${renderScoreTitles(g)}
    ${renderPersonalBests(g)}

      <div class="card-header">
        <span class="card-title">Achievements${g.official ? ' <span class=\"official-badge\">Official</span>' : ''}</span>
        <span style="font-size:12px;color:var(--text-3)">${earned} / ${total} pts</span>
      </div>
      ${achHtml}
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Play History</span></div>
      ${histHtml}
    </div>`;
}

function calcStreak(gid) {
  const plays = [...(appState[gid]?.plays||[])].sort((a,b)=>b.ts-a.ts);
  let s=0; for(const p of plays){if(p.win)s++;else break;}
  return s > 0 ? `${s}W` : plays.length > 0 ? '0' : '—';
}

    }
  }
  document.getElementById('settingsGameList').innerHTML = `
    <div class="card-header"><span class="card-title">Games (${GAME_DEFINITIONS.length})</span><span style="font-size:11px;color:var(--text-3)">A–Z</span></div>
    ${sorted.map(g=>`
      <div class="settings-row">
        <span>${g.icon} ${g.name}</span>
        <span class="settings-row-val">${g.achievements?.length||0} achievements</span>
      </div>`).join('')}`;
}

function buildSummary(g, p) {
  if (!g.logFields) return '';
  const parts = g.logFields
    .filter(f=>f.id!=='win')
    .slice(0,2)
    .map(f=>{
      const v=p[f.id];
      if(v===undefined||v===null) return null;
      if(typeof v==='boolean') return v?f.trueLabel:null;
      if(v==='Any / Unknown'||v==='Unknown'||v==='None') return null;
      return String(v);
    }).filter(Boolean);
  return parts.join(' · ');
}

let logGameId=null, modalToggles={}, editPlayIndex=-1;

function openModal(gid, playIdx=-1) {
  logGameId=gid; editPlayIndex=playIdx;
  const g=GAME_DEFINITIONS.find(x=>x.id===gid);
  modalToggles={};
  const isEdit = playIdx >= 0;
  const existingPlay = isEdit ? (appState[gid]?.plays||[])[playIdx] : null;

  document.getElementById('modalTitle').textContent = isEdit ? `Edit Play — ${g.name}` : `Log Play — ${g.name}`;
  document.getElementById('modalSubmit').textContent = isEdit ? 'Save Changes' : 'Log Play';
  document.getElementById('modalSubmit').style.background = g.color;
  document.getElementById('modalDelete').style.display = isEdit ? '' : 'none';

  const existingDate = existingPlay ? existingPlay.date : new Date().toISOString().split('T')[0];
  const dateHtml = `<div class="modal-field">
    <label class="modal-label">Date</label>
    <input class="modal-input" type="date" id="modal_date" value="${existingDate}">
  </div>`;

  let html='';
  g.logFields.forEach(f=>{
    const existing = existingPlay?.[f.id];
    if(f.type==='toggle'){
      modalToggles[f.id] = isEdit ? !!existing : (f.id==='win');
      const on=modalToggles[f.id];
      html+=`<div class="modal-field">
        <div class="modal-toggle-row">
          <span class="toggle-label">${f.label}</span>
          <button class="toggle ${on?'on':''}" id="tog_${f.id}" onclick="toggleField('${f.id}','${f.trueLabel}','${f.falseLabel}')"></button>
        </div>
        <div class="toggle-val" id="togLbl_${f.id}">${on?f.trueLabel:f.falseLabel}</div>
      </div>`;
    } else if(f.type==='select'){
      const selected = isEdit&&existing ? existing : f.options[0];
      html+=`<div class="modal-field">
        <label class="modal-label">${f.label}</label>
        <select class="modal-select" id="fld_${f.id}">
          ${f.options.map(o=>`<option${o===selected?' selected':''}>${o}</option>`).join('')}
        </select>
      </div>`;
    } else if(f.type==='number'){
      const val = isEdit&&existing!==undefined ? existing : f.default;
      html+=`<div class="modal-field">
        <label class="modal-label">${f.label}</label>
        <input class="modal-input" type="number" id="fld_${f.id}" min="${f.min}" max="${f.max}" value="${val}">
      </div>`;
    }
  });

  const existingNotes = existingPlay?.notes || '';
  const notesHtml = `<div class="modal-field">
    <label class="modal-label">Notes (optional)</label>
    <textarea class="notes-field" id="modal_notes" rows="2" placeholder="Anything to remember…">${existingNotes}</textarea>
  </div>`;
  document.getElementById('modalFields').innerHTML = dateHtml + html + notesHtml;
  document.getElementById('modalOverlay').classList.add('open');
}

function editPlay(gid, idx) { openModal(gid, idx); }

function deletePlay() {
  deletePlayAt(logGameId, editPlayIndex);
  closeModal();
}

function deletePlayAt(gid, idx) {
  if (!appState[gid]?.plays) return;
  appState[gid].plays.splice(idx,1);
  // Recheck achievements — some may need to be revoked
  // Simple approach: just re-render (don't revoke already unlocked)
  saveState();
  const g = GAME_DEFINITIONS.find(x=>x.id===gid);
  if (currentGameId===gid) renderGameDetail(g);
  renderAll();
  showToast('Play deleted');
}

function toggleField(id,tl,fl){
  modalToggles[id]=!modalToggles[id];
  document.getElementById('tog_'+id).classList.toggle('on',modalToggles[id]);
  document.getElementById('togLbl_'+id).textContent=modalToggles[id]?tl:fl;
}
function handleOverlayClick(e){if(e.target===document.getElementById('modalOverlay'))closeModal();}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');}

function submitPlay(){
  const g=GAME_DEFINITIONS.find(x=>x.id===logGameId);
  const dateEl=document.getElementById('modal_date');
  const playDate=dateEl?.value||new Date().toISOString().split('T')[0];
  const play={ts:new Date(playDate+'T12:00:00').getTime(),date:playDate};
  g.logFields.forEach(f=>{
    if(f.type==='toggle')      play[f.id]=!!modalToggles[f.id];
    else if(f.type==='number') play[f.id]=parseFloat(document.getElementById('fld_'+f.id).value)||0;
    else                       play[f.id]=document.getElementById('fld_'+f.id).value;
  });
  if(!appState[logGameId]) appState[logGameId]={plays:[]};
  if(editPlayIndex>=0){
    appState[logGameId].plays[editPlayIndex]=play;
  } else {
    appState[logGameId].plays.push(play);
  }
  const newUnlocks=checkAll();
  saveState();
  const g2=GAME_DEFINITIONS.find(x=>x.id===logGameId);
  if(currentGameId===logGameId) renderGameDetail(g2);
  renderAll();
  closeModal();
  showToast(editPlayIndex>=0?'Play updated':`Play logged — ${play.win?'✓ Win':'✗ Loss'}`);
  if(newUnlocks.length>0) setTimeout(()=>showUnlockBanner(newUnlocks[0]),400);
}

function normalizeSpirit(s) {
  if (!s) return 'None';
  return SPIRIT_NORMALIZE[s.toLowerCase()] || s;
}
function normalizeAdversary(s) {
  if (!s || s === 'Spirit Progression' || s === 'No Blight Card' || s === 'Blight Card') return 'None';
  return ADVERSARY_NORMALIZE[s.toLowerCase()] || s;
}

// Parse the ／-separated board field, returning {level, adversary, scenario, extra:[]}
function parseBoard(board) {
  const parts = (board||'').split('\uff0f').map(s => s.trim()).filter(Boolean);
  let level = 0, adversary = 'None', actsCleared = null, ascension = 0;
  const extras = [];

  for (const part of parts) {
    const lvlMatch = part.match(/^Level\s*(\d+)$/i);
    const actMatch = part.match(/^Act\s*(I{1,3}|IV|\d)/i);
    const ascMatch = part.match(/^Ascension\s*(\d+)$/i);
    if (lvlMatch) { level = parseInt(lvlMatch[1]); continue; }
    if (actMatch) {
      const actNum = {'i':1,'ii':2,'iii':3,'iv':4,'1':1,'2':2,'3':3,'4':4};
      actsCleared = actNum[actMatch[1].toLowerCase()] || 1;
      // boss name may follow colon
      continue;
    }
    if (ascMatch) { ascension = parseInt(ascMatch[1]); continue; }
    const norm = normalizeAdversary(part);
    if (norm !== 'None') { adversary = norm; continue; }
    extras.push(part);
  }
  return { level, adversary, actsCleared, ascension, extras };
}

// Parse a single BGStats play object into our format
function parseSinglePlay(play, gameId, playerUuid, games) {
  const ps = play.playerScores?.[0] || {};
  const win   = !!ps.winner;
  const score = parseFloat(ps.score) || 0;
  const role  = (ps.role || '').trim();
  const playDate = (play.playDate || '').slice(0, 10);
  const ts = new Date(playDate + 'T12:00:00').getTime();
  if (!playDate) return null;

  // Parse scoresheet
  let ssData = {};
  try {
    const ss = JSON.parse(play.scoresheet || '{}');
    for (const group of ss.groups || []) {
      for (const row of group.rows || []) {
        const val = row.scores?.[playerUuid];
        if (val !== undefined && val !== '') ssData[row.templateId] = val;
      }
    }
  } catch(e) {}

  const board = parseBoard(play.board);
  const base = { date: playDate, ts, win, score };

  switch (gameId) {
    case 'spiritisland': {
      const roles = role.split(/[\/,]/).map(s => s.trim()).filter(Boolean);
      const s1 = normalizeSpirit(roles[0]);
      const s2 = normalizeSpirit(roles[1]) || 'None';
      const dahan   = parseInt(ssData.livingdahan || 0) || 0;
      const blight  = parseInt(ssData.blight || 0) || 0;
      const invaders = parseInt(ssData.victoryinvadercards || ssData.defeatinvadercards || 0) || 0;
      const diff    = parseInt(ssData.defeatdifficulty || ssData.victorydifficulty || 0) || 0;
      return { ...base, spirit1: s1, spirit2: s2,
        adversary: board.adversary, level: board.level,
        difficulty: diff, invaders, dahan, blight, noBlight: blight === 0 };
    }
    case 'turing': {
      // board field has difficulty: 'Easy', 'Medium', 'Hard', or puzzle number
      const rawBoard = (play.board || '').trim();
      const diffMap = { 'easy':'Easy', 'medium':'Normal', 'hard':'Hard', 'extreme':'Extreme' };
      const diff = diffMap[rawBoard.toLowerCase()] || (rawBoard.match(/^\d+$/) ? 'Normal' : 'Normal');
      return { ...base, difficulty: diff, rounds: 0, queries: 0, noMistake: false };
    }
    case 'skies': {
      const city = normalizeCity(role);
      return { ...base, city, hardSky: false, roundsLeft: 0, shipsDestroyed: 0 };
    }
    case 'cascadia': {
      return { ...base, natureTokens: 0, maxWildlifeCount: 0, wildlifeTypes: 5,
        scoreBears:0, scoreElk:0, scoreSalmon:0, scoreHawks:0, scoreFoxes:0,
        bestHabitatScore:0, habitatsOver5:0, habitatMajorities:0, keystonesCompleted:0,
        hadBears:true, hadElk:true, hadSalmon:true, hadHawks:true, hadFoxes:true };
    }
    case 'sts': {
      const chars = role.split(/[\/,]/).map(s=>s.trim()).filter(Boolean);
      const actStr = board.actsCleared;
      const actsMap = {1:'Act 1', 2:'Act 2', 3:'Act 3', 4:'Act 4'};
      return { ...base,
        character:  chars[0] || 'Ironclad',
        character2: chars[1] || 'None',
        character3: chars[2] || 'None',
        character4: chars[3] || 'None',
        actsCleared: actsMap[actStr] || (win ? 'Act 3' : 'Act 2'),
        ascension: board.ascension,
        playerCount: 1,
        deckSize: 10, relicCount: 0, hpFull: false, noRares: false,
        noRelics: false, dailyClimb: false, bossT1: false,
        hitStrength: false, hitPoison: false, hitBlock: false,
        play7shivs: false, have7powers: false, killedTransient: false, infiniteCombo: false,
      };
    }
    case 'dorfromantik': {
      return { ...base,
        cs_castle:false, cs_clouds:false, cs_farm:false, cs_forest_tunnel:false,
        cs_grain_tunnel:false, cs_shepherdess:false, cs_signalman:false,
        cs_village_tunnel:false, cs_flag_meadow:false,
        ba_balloon:false, ba_construction:false, ba_farm:false, ba_forest_cabin:false,
        ba_golden_heart:false, ba_harbor:false, ba_harvest:false, ba_hearts_desire:false,
        ba_locomotive:false, ba_road:false, ba_red_hearts:false, ba_ship:false,
        ba_train:false, ba_wildflower:false,
      };
    }
    case 'warps': {
      return { ...base, ship: role || 'Any / Unknown',
        mothership: board.extras[0] || 'Any / Unknown',
        warpsUsed: 3, noLoss: false };
    }
    case 'palm': {
      return { ...base, round2: false, noWaste: false };
    }
    case 'friday': {
      // board = 'Level 1'/'Level 2'/'Level 3'
      const lvlMap = {'level 1':'Level 1','level 2':'Level 2','level 3':'Level 3','level 4':'Level 4'};
      const diff = lvlMap[(play.board||'').toLowerCase()] || 'Level 1';
      // score string may be '36+50+30-5-24' - evaluate it
      let parsedScore = 0;
      try { parsedScore = eval((ps.score||'0').replace(/--/g,'+')) || 0; } catch(e) {}
      return { ...base, difficulty: diff, score: parsedScore, lifeLeft: 0 };
    }
    case 'planetx': {
      const modeMap = {'standard':'Standard','expert':'Expert'};
      const mode = modeMap[(play.board||'').toLowerCase()] || 'Standard';
      // role = 'Beginner - 8 Clues', '4 Clues', 'Genius - 0 Clues'
      const role = (ps.role||'').toLowerCase();
      let clues = '4 Clues';
      if (role.includes('8') || role.includes('beginner')) clues = '8 Clues (Beginner)';
      else if (role.includes('0') || role.includes('genius')) clues = '0 Clues (Genius)';
      // comments often has 'Bot X points'
      const botMatch = (play.comments||'').match(/bot\s+(\d+)/i);
      const botScore = botMatch ? parseInt(botMatch[1]) : 0;
      return { ...base, mode, clues, score: parseFloat(ps.score)||0, botScore };
    }
    case 'hadrians': {
      const boardParts = (play.board||'').split('／').map(s=>s.trim());
      const diffMap = {'easy':'Easy','medium':'Medium','hard':'Hard'};
      let diff = 'Easy', fort = 'Any';
      for (const part of boardParts) {
        if (diffMap[part.toLowerCase()]) diff = diffMap[part.toLowerCase()];
        else if (part.toLowerCase().startsWith('fort')) fort = part;
        else if (part.toLowerCase().startsWith('solo challenge')) fort = part;
      }
      return { ...base, difficulty: diff, fort, score: parseFloat(ps.score)||0 };
    }
    case 'clever': {
      return { ...base, score: parseFloat(ps.score)||0, mode: 'Solo' };
    }
    case 'onedeck': {
      const boardParts = (play.board||'').split('／').map(s=>s.trim());
      const dungeons = ["Dragon's Cave","Hydra's Reef","Yeti's Peak","Dragonshard Mines"];
      const difficulties = ['Novice','Standard','Veteran','Heroic'];
      // BGStats stores Dragon not Dragon's Cave
      const dungeonMap = {
        'dragon':"Dragon's Cave", "dragon's cave":"Dragon's Cave",
        "hydra's reef":"Hydra's Reef", 'hydra':"Hydra's Reef",
        "yeti's peak":"Yeti's Peak", 'yeti':"Yeti's Peak",
        'dragonshard mines':'Dragonshard Mines',
      };
      let dungeon = "Dragon's Cave", difficulty = 'Novice';
      for (const part of boardParts) {
        const dl = dungeonMap[part.toLowerCase()];
        if (dl) dungeon = dl;
        if (difficulties.map(d=>d.toLowerCase()).includes(part.toLowerCase()))
          difficulty = difficulties.find(d=>d.toLowerCase()===part.toLowerCase());
      }
      const roles = (ps.role||'').split(/[\/,]/).map(s=>s.trim()).filter(Boolean);
      return { ...base, character: roles[0]||'Archer', character2: roles[1]||'None',
        dungeon, difficulty };
    }
    case 'sprawlopolis': {
      // board = '01 The Outskirts／02 Bloom Boom／03 Go Green'
      // extract target score by summing card numbers
      const boardParts = (play.board||'').split('／').map(s=>s.trim());
      const targetScore = boardParts.reduce((sum,p) => {
        const m = p.match(/^(\d+)/);
        return sum + (m ? parseInt(m[1]) : 0);
      }, 0);
      // score string may be complex like '2+3+3+4-14+3+14+14'
      let parsedScore = 0;
      try { parsedScore = eval((ps.score||'0').replace(/--/g,'+')) || 0; } catch(e) {}
      return { ...base, score: parsedScore, targetScore: targetScore || 9 };
    }
    case 'orchard': {
      return { ...base, score: parseFloat(ps.score)||0, perfect: false };
    }
    case 'frosthaven': {
      // board = 'Difficulty 1／3 - Algox Offensive' or '1／Difficulty 1'
      const boardParts = (play.board||'').split('／').map(s=>s.trim());
      let difficulty = 1, scenario = 1;
      for (const part of boardParts) {
        const diffM = part.match(/difficulty\s*(\d+)/i);
        if (diffM) { difficulty = parseInt(diffM[1]); continue; }
        const scenM = part.match(/^(\d+)/);
        if (scenM) scenario = parseInt(scenM[1]);
      }
      // role = 'Drifter／Deathwalker'
      const chars = (ps.role||'').split('／').map(s=>s.trim()).filter(Boolean);
      return { ...base, character1: chars[0]||'Drifter', character2: chars[1]||'None',
        scenario, difficulty };
    }
    case 'planetunknown': {
      return { ...base, targetScore: 60, asymmetric: false, metObj: false, noMeteorites: false,
        planet: 'Unknown', corporation: 'Unknown' };
    }
    case 'cartographers': {
      return { ...base, season: 'All Seasons', coins: 0, monsters: 0, allEdicts: false };
    }
    case 'railroad': {
      return { ...base, exits: 0, longest: 0, centre: 0, errors: 0, edition: 'Deep Blue' };
    }
    default:
      return base;
  }
}

function normalizeCity(role) {
  const cities = ['London','New York','Tokyo','Berlin','Sydney','Moscow','Rio de Janeiro','Cairo'];
  const r = (role||'').toLowerCase();
  return cities.find(c => c.toLowerCase() === r) || role || 'Any / Unknown';
}

// Parse full BGStatsExport.json
function parseFullExport(jsonText) {
  let data;
  try { data = JSON.parse(jsonText); }
  catch(e) { return { error: 'Invalid JSON — make sure you pasted the full file.' }; }

  // Detect format
  const isSinglePlay = Array.isArray(data.plays) && data.games && !data.challenges;
  const isFullExport = Array.isArray(data.plays) && Array.isArray(data.challenges);

  if (!data.plays) return { error: 'No plays found in this file.' };

  const meId     = data.userInfo?.meRefId;
  const players  = data.players || [];
  const mePlayer = players.find(p => p.id === meId) || players[0];
  const meUuid   = mePlayer?.uuid;

  const gamesById  = {};
  (data.games||[]).forEach(g => gamesById[g.id] = g);

  // Build results per tracker game
  const results = {};

  for (const play of data.plays) {
    if (play.ignored) continue;
    const bgGame = gamesById[play.gameRefId];
    if (!bgGame) continue;
    const trackerId = BGG_TO_TRACKER[bgGame.bggId];
    if (!trackerId) continue;

    const parsed = parseSinglePlay(play, trackerId, meUuid, gamesById);
    if (!parsed) continue;
    if (!results[trackerId]) results[trackerId] = [];
    results[trackerId].push(parsed);
  }

  // Sort each game's plays by date
  for (const gid of Object.keys(results)) {
    results[gid].sort((a,b) => a.ts - b.ts);
  }

  const totalPlays = Object.values(results).reduce((s,a) => s+a.length, 0);
  return { results, playerName: mePlayer?.name || 'Unknown', totalPlays };
}

// ── Import UI state ──

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
loadState(); checkAll(); renderAll();
</script>
